[package]
name = "mcp_hub"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
description = "Multi-user MCP management and proxy hub"
license = "MIT OR Apache-2.0"

[dependencies]
# Async runtime + HTTP
tokio = { version = "1", features = ["full"] }
axum = { version = "0.8", features = ["macros"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["trace", "fs", "limit", "set-header"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Database
sqlx = { version = "0.8", default-features = false, features = [
    "runtime-tokio",
    "sqlite",
    "macros",
    "migrate",
] }

# Errors + logging
anyhow = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Crypto (stable lines, rand_core 0.6 compatible)
chacha20poly1305 = "0.10"
rand = "0.8"
base64 = "0.22"
sha2 = "0.10"

# Auth: passkeys + signed cookies
webauthn-rs = { version = "0.5", features = ["danger-allow-state-serialisation"] }
axum-extra = { version = "0.10", features = ["cookie", "cookie-signed"] }
url = "2"

# OAuth 2.1 Authorization Server: ES256 JWTs + key material
jsonwebtoken = "9"
p256 = { version = "0.13", features = ["ecdsa", "pkcs8", "pem", "jwk"] }

# Model Context Protocol SDK (proxy server + backend clients)
rmcp = { version = "0.9", features = [
    "server",
    "client",
    "macros",
    "server-side-http",
    "tower",
    "transport-streamable-http-server",
    "transport-streamable-http-server-session",
    "transport-child-process",
    "transport-streamable-http-client",
    "transport-streamable-http-client-reqwest",
    "reqwest",
] }

# Misc
uuid = { version = "1", features = ["v4", "serde"] }
time = { version = "0.3", features = ["formatting", "macros"] }
shlex = "1"

# Unix sandboxing (geteuid / chown for dropping stdio subprocesses to a UID)
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
uuid = { version = "1", features = ["v4"] }
serde_json = "1"
cookie = { version = "0.18", features = ["signed"] }
schemars = "1"
rmcp = { version = "0.9", features = [
    "server",
    "client",
    "macros",
    "schemars",
    "transport-io",
    "transport-child-process",
    "transport-streamable-http-client",
    "transport-streamable-http-client-reqwest",
    "reqwest",
] }

[profile.release]
strip = true
lto = "thin"
